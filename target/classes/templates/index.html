<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to My Azure cloud testing Java Web App</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h4 class="mt-5">Student CRUD forum</h4>
        <div class="row">
            <div class="col-md-6">
                <h2>Create / Update Student</h4>
                <form id="student-form">
                    <input type="hidden" id="student-id">
                    <div class="form-group">
                        <label>First Name</label>
                        <input class="form-control" id="firstName">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input class="form-control" id="lastName">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input class="form-control" id="email">
                    </div>
                    <button class="btn btn-primary" id="save-btn" type="button">Save</button>
                    <button class="btn btn-secondary" id="reset-btn" type="button">Reset</button>
                </form>
            </div>
            <div class="col-md-6">
                <h4>Students</h4>
                <button class="btn btn-sm btn-info mb-2" id="refresh-btn">Refresh</button>
                <table class="table table-sm" id="students-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>First</th>
                            <th>Last</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const api = '/api/students';

        async function refresh() {
            const res = await fetch(api);
            const list = await res.json();
            const tbody = document.querySelector('#students-table tbody');
            tbody.innerHTML = '';
            list.forEach(s => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${s.id}</td><td>${s.firstName}</td><td>${s.lastName}</td><td>${s.email}</td>`;
                const actions = document.createElement('td');
                const edit = document.createElement('button');
                edit.className = 'btn btn-sm btn-warning mr-1';
                edit.textContent = 'Edit';
                edit.onclick = () => loadToForm(s);
                const del = document.createElement('button');
                del.className = 'btn btn-sm btn-danger';
                del.textContent = 'Delete';
                del.onclick = async () => {
                    if (!confirm('Delete student ' + s.id + '?')) return;
                    await fetch(api + '/' + s.id, { method: 'DELETE' });
                    refresh();
                };
                actions.appendChild(edit);
                actions.appendChild(del);
                tr.appendChild(actions);
                tbody.appendChild(tr);
            });
        }

        function loadToForm(s) {
            document.getElementById('student-id').value = s.id;
            document.getElementById('firstName').value = s.firstName;
            document.getElementById('lastName').value = s.lastName;
            document.getElementById('email').value = s.email;
        }

        document.getElementById('save-btn').onclick = async () => {
            const id = document.getElementById('student-id').value;
            const payload = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value
            };
            if (id) {
                await fetch(api + '/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                await fetch(api, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }
            document.getElementById('reset-btn').click();
            refresh();
        };

        document.getElementById('reset-btn').onclick = () => {
            document.getElementById('student-id').value = '';
            document.getElementById('firstName').value = '';
            document.getElementById('lastName').value = '';
            document.getElementById('email').value = '';
        };

        document.getElementById('refresh-btn').onclick = refresh;

        // initial load
        refresh();

        // --- Blob upload/download UI handlers ---
        const blobUploadUrl = '/api/blob/upload';
        const blobDownloadUrl = '/api/blob/download';

        // Azure Function integration removed. If needed, re-add helper and URL here.

        async function uploadBlob() {
            const input = document.getElementById('blob-file');
            if (!input.files || input.files.length === 0) {
                alert('Please select a file to upload');
                return;
            }
            const file = input.files[0];
            const fd = new FormData();
            fd.append('file', file);
            try {
                const res = await fetch(blobUploadUrl, { method: 'POST', body: fd });
                if (!res.ok) throw new Error('Upload failed: ' + res.status);
                const data = await res.json().catch(() => null);
                document.getElementById('blob-status').textContent = 'Upload successful' + (data && data.name ? (': ' + data.name) : '');
            } catch (e) {
                console.error(e);
                alert('Upload error: ' + e.message);
            }
        }

        async function downloadBlob() {
            const defaultName = 'nag_01_logo_azure.jpeg';
            const name = document.getElementById('blob-name').value || defaultName;
            const url = blobDownloadUrl + '?name=' + encodeURIComponent(name);
            try {
                const res = await fetch(url);
                if (!res.ok) { alert('Download failed: ' + res.status); return; }
                const blob = await res.blob();
                // try to get filename from headers
                let filename = 'download';
                const cd = res.headers.get('Content-Disposition');
                if (cd) {
                    const m = cd.match(/filename\*=UTF-8''([^;\n]+)/) || cd.match(/filename="?([^";]+)"?/);
                    if (m) filename = decodeURIComponent(m[1]);
                }
                // preview if image
                const preview = document.getElementById('blob-preview');
                const urlObj = URL.createObjectURL(blob);
                if (blob.type.startsWith('image/')) {
                    preview.src = urlObj;
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                }
                // trigger download
                const a = document.createElement('a');
                a.href = urlObj;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                // revoke after short delay
                setTimeout(() => URL.revokeObjectURL(urlObj), 5000);
                document.getElementById('blob-status').textContent = 'Download complete: ' + filename;
            } catch (e) {
                console.error(e);
                alert('Download error: ' + e.message);
            }
        }

        // convenience: download specific logo directly
        async function downloadLogo() {
            const name = 'nag_01_logo_azure.jpeg';
            const url = blobDownloadUrl + '?name=' + encodeURIComponent(name);
            try {
                const res = await fetch(url);
                if (!res.ok) { alert('Download failed: ' + res.status); return; }
                const blob = await res.blob();
                const urlObj = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = urlObj;
                a.download = name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(urlObj), 5000);
                document.getElementById('blob-status').textContent = 'Logo download complete: ' + name;
                const preview = document.getElementById('blob-preview');
                if (blob.type.startsWith('image/')) {
                    preview.src = urlObj;
                    preview.style.display = 'block';
                }
            } catch (e) {
                console.error(e);
                alert('Download error: ' + e.message);
            }
        }

        // wire blob buttons
        (function wireBlob() {
            // create UI elements in the page below the students table
            const container = document.querySelector('.container');
            const section = document.createElement('div');
            section.className = 'mt-4';
            section.innerHTML = `
                <h4>Azure Blob Storage</h4>
                <div class="form-row align-items-center">
                    <div class="col-auto">
                        <input type="file" id="blob-file" class="form-control-file mr-2">
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-success" id="upload-blob-btn">Upload</button>
                    </div>
                    <div class="col-auto">
                        <input class="form-control" id="blob-name" placeholder="Blob name (for download)" value="nag_01_logo_azure.jpeg">
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-outline-primary" id="download-logo-btn">Download Logo</button>
                    </div>
                </div>
                <div class="mt-3">
                    <span id="blob-status" class="text-muted"></span>
                </div>
                <div class="mt-2">
                    <img id="blob-preview" style="max-width:300px; display:none; border:1px solid #ddd; padding:4px;" alt="preview">
                </div>
            `;
            container.appendChild(section);
            document.getElementById('upload-blob-btn').onclick = uploadBlob;
            document.getElementById('download-logo-btn').onclick = downloadLogo;
        })();
    </script>
</body>
</html>
