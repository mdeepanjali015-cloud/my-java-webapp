name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Xmx2G
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven local repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn -B clean install

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: webapp-jar
          path: target/*.jar

  deploy:
    name: Deploy to Azure Web App
    needs: build
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v3
        with:
          name: webapp-jar

      # Option A: Publish Profile (simplest)
      - name: Deploy using publish profile
        if: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: '*.jar'

      # Option B: Service Principal (recommended for longer pipelines)
      - name: Login to Azure (Service Principal)
        if: ${{ env.AZURE_CREDENTIALS != '' && env.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        uses: azure/login@v1
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Deploy using service principal
        if: ${{ env.AZURE_CREDENTIALS != '' && env.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: '*.jar' 

      - name: "Post-deploy: Confirm availability"
        run: |
          echo "Waiting for app to become available..."
          for i in {1..12}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://$AZURE_WEBAPP_NAME.azurewebsites.net/ || true)
            echo "status=$status"
            if [ "$status" = "200" ] || [ "$status" = "302" ]; then
              echo "App is responding"
              exit 0
            fi
            sleep 5
          done
          echo "App did not respond in time"
          exit 1
