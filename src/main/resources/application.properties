spring.datasource.url=jdbc:sqlserver://sql-app-server-dev.database.windows.net:1433;databaseName=sql-app-db-dev
spring.datasource.username=sql-server-admin-dev@sql-app-server-dev
spring.datasource.password=DBuser@123
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
server.port=8080
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG

# Azure Blob storage settings
# Set `AZURE_STORAGE_CONNECTION_STRING` env var or set `azure.storage.connection-string` here (not recommended for secrets).
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container=app-files
